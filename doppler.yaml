# Doppler project configuration
# https://docs.doppler.com/docs/docker-compose
#
# Setup:
#   1. Install Doppler CLI: https://docs.doppler.com/docs/install-cli
#   2. Authenticate: doppler login
#   3. Create a project: doppler projects create openshift-lab
#   4. Setup the project: doppler setup
#   5. Add your secrets in Doppler dashboard or via CLI:
#      doppler secrets set SUSHY_EMULATOR_PROXMOX_PASSWORD "your-password"
#      doppler secrets set SUSHY_EMULATOR_PROXMOX_URL "https://192.168.0.230:8006/api2/json"
#      doppler secrets set SUSHY_EMULATOR_PROXMOX_USER "root@pam"
#   6. Run: doppler run -- docker compose -f infra/docker-compose.yml up -d