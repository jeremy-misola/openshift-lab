apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ .Values.policy.name }}
  namespace: {{ .Values.policy.namespace }}
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: {{ .Values.policy.remediationAction }}
  disabled: {{ .Values.policy.disabled }}
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: baseline-namespace
        spec:
          remediationAction: {{ .Values.policy.remediationAction }}
          severity: low
          namespaceSelector:
            include:
              - "*"
            exclude:
              - kube-*
              - openshift-*
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: {{ .Values.baseline.namespace.name }}
                  labels:
{{ toYaml .Values.baseline.namespace.labels | indent 20 }}
{{- if .Values.baseline.limitRange.enabled }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: baseline-resource-requests
        spec:
          remediationAction: {{ .Values.policy.remediationAction }}
          severity: low
          namespaceSelector:
            include:
              - {{ .Values.baseline.namespace.name | quote }}
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: LimitRange
                metadata:
                  name: baseline-defaults
                  namespace: {{ .Values.baseline.namespace.name }}
                spec:
                  limits:
                    - type: Container
                      defaultRequest:
                        cpu: {{ .Values.baseline.limitRange.defaultRequestCpu | quote }}
                        memory: {{ .Values.baseline.limitRange.defaultRequestMemory | quote }}
{{- end }}
