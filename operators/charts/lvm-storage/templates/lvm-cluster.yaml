apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: {{ .Values.lvmCluster.name }}
  namespace: {{ .Values.namespace }}
spec:
  storage:
    deviceClasses:
      - name: {{ .Values.lvmCluster.deviceClassName }}
        thinPoolConfig:
          name: {{ .Values.lvmCluster.thinPoolName }}
          sizePercent: {{ .Values.lvmCluster.thinPoolSizePercent }}
          overprovisionRatio: {{ .Values.lvmCluster.overprovisionRatio }}
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/master
                  operator: Exists
        deviceSelector:
          paths:
            - {{ required "lvmCluster.devicePath must name the dedicated SNO data disk" .Values.lvmCluster.devicePath | quote }}
