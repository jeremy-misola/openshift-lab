apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-storage-operatorgroup
  namespace: {{ .Values.namespace }}
spec:
  targetNamespaces:
    - {{ .Values.namespace }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscription.name }}
  namespace: {{ .Values.namespace }}
spec:
  channel: {{ .Values.subscription.channel }}
  installPlanApproval: {{ .Values.subscription.installPlanApproval }}
  name: {{ .Values.subscription.name }}
  source: {{ .Values.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
---
apiVersion: lvm.topolvm.io/v1alpha1
kind: LVMCluster
metadata:
  name: {{ .Values.lvmCluster.name }}
  namespace: {{ .Values.namespace }}
spec:
  storage:
    deviceClasses:
      - name: {{ .Values.lvmCluster.deviceClassName }}
        thinPoolConfig:
          name: {{ .Values.lvmCluster.thinPoolName }}
          sizePercent: {{ .Values.lvmCluster.thinPoolSizePercent }}
          overprovisionRatio: {{ .Values.lvmCluster.overprovisionRatio }}
        nodeSelector:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/master
                  operator: Exists
        deviceSelector:
          paths:
            - {{ required "lvmCluster.devicePath must name the dedicated SNO data disk" .Values.lvmCluster.devicePath | quote }}
