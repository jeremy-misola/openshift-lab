{{- range .Values.hostedClusters }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hosted-cluster-{{ .name }}
  namespace: {{ $.Values.gitops.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: {{ $.Values.gitops.project }}
  source:
    repoURL: {{ $.Values.gitops.repoURL }}
    targetRevision: {{ $.Values.gitops.targetRevision }}
    path: operators/charts/managed-cluster
    helm:
      valueFiles:
        - values/{{ .valuesFile }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
{{- end }}
