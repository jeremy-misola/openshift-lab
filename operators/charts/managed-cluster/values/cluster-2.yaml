cluster:
  name: cluster-2
  namespace: clusters
  infraID: cluster-2
  baseDomain: home.lan
  releaseImage: quay.io/openshift-release-dev/ocp-release:REPLACE_ME-x86_64
  pullSecretName: cluster-2-pull-secret
  sshKeyName: cluster-2-ssh-key
  controllerAvailabilityPolicy: SingleReplica
  infrastructureAvailabilityPolicy: SingleReplica
  networking:
    clusterNetwork:
      - cidr: 10.136.0.0/14
    serviceNetwork:
      - cidr: 172.30.0.0/16
    networkType: OVNKubernetes
  platform:
    type: Agent
    config:
      agent:
        agentNamespace: clusters-cluster-2
  services:
    - service: APIServer
      servicePublishingStrategy:
        type: LoadBalancer
    - service: OAuthServer
      servicePublishingStrategy:
        type: Route
    - service: Konnectivity
      servicePublishingStrategy:
        type: Route

nodePool:
  replicas: 1
  autoRepair: false
  upgradeType: Replace
  platformConfig:
    agent:
      agentLabelSelector:
        matchLabels:
          infraenvs.agent-install.openshift.io: hosted

agent:
  # HyperShift creates this namespace from HostedCluster namespace/name.
  namespace: clusters-cluster-2
  infraEnvName: cluster-2
  pullSecretName: pull-secret
  sshAuthorizedKey: REPLACE_ME

# Supply real values through a non-committed override file.
#
# BMC is served by the "proxmox-redfish" daemon (infra/docker-compose.yml),
# not sushy-tools -- see infra/sushy/sushy.conf for why sushy-tools can't
# talk to Proxmox at all.
#
#   address:  redfish-virtualmedia://<proxmox-redfish-host>:8000/redfish/v1/Systems/<proxmox-vmid>
#             The last path segment MUST be the numeric Proxmox VMID (e.g. "201"),
#             not an arbitrary name -- that's how proxmox-redfish maps a Redfish
#             "System" to a VM.
#   username/password: this is the Basic Auth BMO sends to the daemon's Redfish
#             endpoint -- it is checked separately from the daemon's own
#             Proxmox connection, so it CAN be a Proxmox API token here:
#               username: <user>@<realm>!<token-name>   (e.g. redfish@pam!bmo)
#               password: <token-secret-uuid>
#             (proxmox_redfish.py's authenticate_user() detects the "!" +
#             36-char UUID shape and validates it as a token instead of a
#             password.) A plain user/password also works.
#             NOTE: this is unrelated to the daemon's own PROXMOX_USER/
#             PROXMOX_PASSWORD in infra/docker-compose.yml -- those actually
#             drive every Proxmox API call the daemon makes (power, virtual
#             media, etc.) and currently MUST be a real password, since
#             proxmoxer only does token auth when passed separate
#             token_name/token_value args, which get_proxmox_api() never
#             supplies. Don't put your Terraform token there.
bareMetalHosts:
  - name: cluster-2-worker-0
    bmcSecretName: cluster-2-worker-0-bmc
    bootMode: UEFI
    bootMACAddress: "REPLACE_ME"  # MAC of this VM's configured NIC in Proxmox
    bmc:
      address: redfish-virtualmedia://REPLACE_ME_PROXMOX_REDFISH_HOST:8000/redfish/v1/Systems/REPLACE_ME_VMID
      username: REPLACE_ME
      password: REPLACE_ME
    rootDeviceHints:
      deviceName: /dev/vda
