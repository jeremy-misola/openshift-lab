apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    # Grants openshift-gitops-argocd-application-controller namespace-admin
    # privileges here, since the default cluster role only gives it
    # cluster-wide read (get/list/watch). Without this, ArgoCD can create the
    # Namespace/Subscription/OperatorGroup (covered by the default role) but
    # is forbidden from creating/patching the metallb.io CRs (MetalLB,
    # IPAddressPool, L2Advertisement) that live in this namespace.
    argocd.argoproj.io/managed-by: openshift-gitops