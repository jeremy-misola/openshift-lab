apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-platform
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/jeremy-misola/openshift-lab.git
    targetRevision: main
    path: operators
    helm:
      valueFiles:
        - values/hub.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
