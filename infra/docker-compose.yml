services:
  bind9:
    container_name: bind-dns
    image: ubuntu/bind9:latest
    environment:
      - BIND9_USER=root
      - TZ=America/New_York
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./bind/config:/etc/bind
      - ./bind/cache:/var/cache/bind
      - ./bind/records:/var/lib/bind
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    restart: always
    ports:
      - "8200:8200"
      - "8201:8201"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config
      - ./vault/data:/vault/data
      - /opt/vault/logs:/vault/logs
      - ./vault/certs:/vault/certs
    command: server

  proxmox-redfish:
    build:
      context: https://github.com/v1k0d3n/proxmox-redfish.git
    container_name: proxmox-redfish
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROXMOX_HOST=192.168.0.230
      - PROXMOX_API_PORT=8006
      # Node name as shown in the Proxmox UI (Datacenter > Node).
      - PROXMOX_NODE=${PVE_NODE}
      # Dedicated Proxmox user for this daemon's own API session (e.g.
      # redfish@pam with VM.Audit/VM.PowerMgmt/VM.Config.CDROM/
      # Datastore.AllocateSpace roles) -- NOT the Terraform token in
      # Terraform/terraform.tfvars. Injected via Doppler/.env.
      - PROXMOX_USER=${PVE_REDFISH_USER}
      - PROXMOX_PASSWORD=${PVE_REDFISH_PASSWORD}
      - PROXMOX_ISO_STORAGE=local
      - VERIFY_SSL=false
      - REDFISH_PORT=8000
      - REDFISH_HOST=0.0.0.0
      - REDFISH_LOG_LEVEL=INFO
    volumes:
      # The daemon hardcodes logging.handlers.SysLogHandler(address="/dev/log"),
      # but python:3.11-slim has no syslog daemon, so /dev/log doesn't exist in
      # the container and every log call throws "Bad file descriptor" /
      # "No such file or directory" to stderr. Bind-mounting the host's syslog
      # socket (present via journald/rsyslog on this LXC) fixes it with no
      # source changes -- daemon logs land in the host journal as normal.
      - /dev/log:/dev/log